name: OpenRouter smoke

# Opt-in only. Runs two inexpensive calls (plain text + forced tool call) against
# the real OpenRouter API through the generic OpenAI-compatible adapter. Never
# runs on pull_request (fork PRs have no secrets) and never shares a job with
# untrusted sandbox code.
on:
  workflow_dispatch:

concurrency:
  group: openrouter-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository_owner == 'AlexKagan'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.8"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Record provider package versions
        run: uv pip list | grep -Ei '^(langchain|langchain-core|langchain-openai|openai) '

      - name: OpenRouter smoke
        env:
          AGENTSCOPE_OPENROUTER_API_KEY: ${{ secrets.AGENTSCOPE_OPENROUTER_API_KEY }}
          AGENTSCOPE_OPENROUTER_SMOKE_MODEL: ${{ vars.AGENTSCOPE_OPENROUTER_SMOKE_MODEL }}
        run: uv run pytest -m openrouter -o addopts="-ra --strict-markers"
