name: Meta Model API smoke

# Opt-in only. Runs two inexpensive calls (plain text + forced tool call) against
# a real Meta-compatible Model API through the generic OpenAI-compatible adapter,
# verifying the documented cookbook contract. Never runs on pull_request and
# never shares a job with untrusted sandbox code.
on:
  workflow_dispatch:

concurrency:
  group: meta-model-api-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository_owner == 'AlexKagan'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.8"
          enable-cache: true

      - name: Sync (frozen)
        run: uv sync --frozen

      - name: Record provider package versions
        run: uv pip list | grep -Ei '^(langchain|langchain-core|langchain-openai|openai) '

      - name: Meta Model API smoke
        env:
          AGENTSCOPE_META_MODEL_API_KEY: ${{ secrets.AGENTSCOPE_META_MODEL_API_KEY }}
          AGENTSCOPE_META_SMOKE_MODEL: ${{ vars.AGENTSCOPE_META_SMOKE_MODEL }}
        run: uv run pytest -m meta_model_api -o addopts="-ra --strict-markers"
