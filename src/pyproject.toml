[project]
name = "src"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bottleneck>=1.6.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langgraph>=1.2.10",
    "numpy>=2.5.1",
    "openai>=2.53.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
]

[project.scripts]
src = "src:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
